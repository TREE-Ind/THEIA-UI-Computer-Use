[project]
name = "hermes-windows-computer-use"
version = "0.1.0"
description = "Hermes Agent plugin for cross-platform desktop computer use with PyAutoGUI and optional LocateAnything-3B visual grounding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hermes Agent + Joshua" }]
dependencies = [
  "pyautogui>=0.9.54",
  "pillow>=10.0.0",
  "pygetwindow>=0.0.9",
  "pywin32>=306; platform_system == 'Windows'",
]

# The Python LocateAnything worker has its own isolated environment, installed
# from requirements-locate.txt by scripts/setup_locate_worker.py. Do not expose
# those dependencies as project extras: Hermes's uv workspace resolves every
# member extra against core pins even when the extra is not selected.

[tool.pytest.ini_options]
testpaths = ["tests"]

